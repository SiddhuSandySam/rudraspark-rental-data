name: RudraSpark Rental Image Refresher

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at Midnight UTC
  workflow_dispatch: 
    inputs:
      state:
        description: 'Target State or leave empty for ALL'
        required: false
        default: ''

concurrency:
  group: rudraspark-rental-refresher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Rental Refresher ${{ matrix.worker_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        worker_id: [0, 1, 2, 3, 4] # 5 Parallel Refresher Workers

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install axios playwright
          npx playwright install chromium --with-deps
          sudo apt-get install -y xvfb

      - name: Run Rental Image Refresher
        env:
          DISPLAY: :99
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          node image_refresher.js ${{ matrix.worker_id }} 5 "${{ github.event.inputs.state }}"

      - name: Commit and Push
        if: always()
        run: |
          git config --global user.name "RudraSpark-Rental-Bot"
          git config --global user.email "bot@rudraspark.app"
          
          git add refresh_logs_*.txt 2>/dev/null || true
          git commit -m "Rental Refresher ${{ matrix.worker_id }} update [skip ci]" || echo "Nothing new"
          
          git checkout -- .
          for i in {1..20}; do
            git fetch origin main
            if git pull --rebase --autostash -X ours origin main; then
              if git push origin main; then
                echo "✅ Refresher pushed successfully!"
                break
              fi
            fi
            git rebase --abort || true
            sleep 15
          done
